[project]
name = "tars-pc-control"
version = "0.1.0"
description = "Windows Bluetooth Classic PC agent for Pybricks 4.1 EV3"
requires-python = ">=3.13"
# Windows Bluetooth APIs and the Python standard library; no BLE dependency.
dependencies = ["numpy>=2.0", "ujson", "pybricks"]

[tool.black]
line-length = 99
skip-string-normalization = true
target-version = ["py312"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.10.1",
]
